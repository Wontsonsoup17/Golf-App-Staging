<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Storage namespacing — must run before any other script on the page.
   Live and staging are BOTH served from wontsonsoup17.github.io, and browsers
   scope localStorage to the ORIGIN, not the path. Without this, the dev site
   shares the real site's session, cached rounds, avatars and version flags:
   signing out of one signs out the other, and a localStorage.clear() on the dev
   site wipes real data.

   The prefix is decided by path/host, NOT by the firebase IS_PLAYGROUND rule,
   because the HTML files are identical on both deployments (only
   firebase-config.js differs). On LIVE the prefix is '' and this whole shim
   no-ops, so live behaviour is byte-for-byte unchanged and no user is signed
   out. */
(function () {
  var h = location.hostname, p = location.pathname || '';
  var pre = (h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0') ? 'dev-'
          : (p.indexOf('/Golf-App-Staging') === 0) ? 'stg-'
          : '';
  if (!pre) return;                         // live — leave everything alone
  var real;
  try { real = window.localStorage; if (!real) return; } catch (e) { return; }
  function mine() {
    var out = [];
    for (var i = 0; i < real.length; i++) {
      var k = real.key(i);
      if (k && k.indexOf(pre) === 0) out.push(k);
    }
    return out;
  }
  var shim = {
    getItem:    function (k) { return real.getItem(pre + k); },
    setItem:    function (k, v) { return real.setItem(pre + k, v); },
    removeItem: function (k) { return real.removeItem(pre + k); },
    // Only ever clears this build's own keys — never the live site's.
    clear:      function () { mine().forEach(function (k) { real.removeItem(k); }); },
    key:        function (i) { var a = mine(); return i < a.length ? a[i].slice(pre.length) : null; },
    get length() { return mine().length; }
  };
  try {
    Object.defineProperty(window, 'localStorage',
      { value: shim, configurable: true, writable: true });
  } catch (e) { /* if it fails we simply keep shared storage — today's behaviour */ }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Test User (dev only)</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="hero" style="padding-bottom:16px">
  <div class="hero-logo">&#9971;</div>
  <h1>Test User Setup</h1>
  <p>Dev / playground environment only</p>
</div>

<div class="main" style="padding-top:0">
  <div class="auth-card">
    <div id="status" style="font-size:14px;line-height:1.6;color:var(--text-light)">Starting…</div>
    <div id="creds" style="display:none;margin-top:16px;padding:14px;background:rgba(255,255,255,0.05);border-radius:10px;font-size:14px">
      <div>Username: <strong>test</strong></div>
      <div>Password: <strong>testtest</strong></div>
    </div>
    <a id="goLogin" href="login.html" style="display:none;margin-top:18px" class="btn-gold">Go to Sign In</a>
  </div>
  <div style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:16px;padding:0 20px;line-height:1.5">
    This page is for the dev environment only. Delete <code>make-test-user.html</code> before deploying to live.
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script>
  var statusEl = document.getElementById('status');
  function show(msg) { statusEl.innerHTML = msg; }

  var host = location.hostname;
  var isLocal = (host !== 'westchester-golf-app.web.app' && host !== 'westchester-golf-app.firebaseapp.com');

  if (!isLocal) {
    show('<span style="color:var(--red,#ff5252)">Refused: this page only runs on localhost (the test environment). ' +
         'You are on "' + host + '", which uses the LIVE database.</span>');
  } else {
    var USERNAME = 'test';
    var PASSWORD = 'testtest';
    var email = USERNAME + '@westchestergolf.app';

    show('Creating the <strong>test</strong> account in the playground database…');

    auth.createUserWithEmailAndPassword(email, PASSWORD)
      .then(function(cred) {
        return cred.user.updateProfile({ displayName: USERNAME }).then(function() {
          return Promise.all([
            db.ref('usernames/' + USERNAME).set(cred.user.uid),
            db.ref('users/' + cred.user.uid + '/profile').set({ username: USERNAME, createdAt: Date.now() }),
            db.ref('credentials/' + USERNAME + '/securityQuestion').set(0),
            db.ref('credentials/' + USERNAME + '/securityAnswer').set(simpleHash('test'))
          ]);
        });
      })
      .then(function() {
        return auth.signOut();
      })
      .then(function() {
        show('<span style="color:var(--green-accent,#00e676)">&#10003; Test account created.</span>');
        document.getElementById('creds').style.display = 'block';
        document.getElementById('goLogin').style.display = 'block';
      })
      .catch(function(err) {
        show('<span style="color:var(--red,#ff5252)">Could not create account: ' + (err && err.message ? err.message : err) + '</span>');
      });
  }
</script>
</body>
</html>

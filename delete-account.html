<!DOCTYPE html>
<html lang="en">
<head>
<style>html,body{background:#132017}</style>
<script>
/* Storage namespacing — must run before any other script on the page.
   Live and staging are BOTH served from wontsonsoup17.github.io, and browsers
   scope localStorage to the ORIGIN, not the path. Without this, the dev site
   shares the real site's session, cached rounds, avatars and version flags:
   signing out of one signs out the other, and a localStorage.clear() on the dev
   site wipes real data.

   The prefix is decided by path/host, NOT by the firebase IS_PLAYGROUND rule,
   because the HTML files are identical on both deployments (only
   firebase-config.js differs). On LIVE the prefix is '' and this whole shim
   no-ops, so live behaviour is byte-for-byte unchanged and no user is signed
   out. */
(function () {
  var h = location.hostname, p = location.pathname || '';
  var pre = (h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0') ? 'dev-'
          : (p.indexOf('/Golf-App-Staging') === 0) ? 'stg-'
          : '';
  if (!pre) return;                         // live — leave everything alone
  var real;
  try { real = window.localStorage; if (!real) return; } catch (e) { return; }
  function mine() {
    var out = [];
    for (var i = 0; i < real.length; i++) {
      var k = real.key(i);
      if (k && k.indexOf(pre) === 0) out.push(k);
    }
    return out;
  }
  var shim = {
    getItem:    function (k) { return real.getItem(pre + k); },
    setItem:    function (k, v) { return real.setItem(pre + k, v); },
    removeItem: function (k) { return real.removeItem(pre + k); },
    // Only ever clears this build's own keys — never the live site's.
    clear:      function () { mine().forEach(function (k) { real.removeItem(k); }); },
    key:        function (i) { var a = mine(); return i < a.length ? a[i].slice(pre.length) : null; },
    get length() { return mine().length; }
  };
  try {
    Object.defineProperty(window, 'localStorage',
      { value: shim, configurable: true, writable: true });
  } catch (e) { /* if it fails we simply keep shared storage — today's behaviour */ }
})();
</script>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#132017">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Delete Test Accounts - Golf Tracker</title>
<link rel="stylesheet" href="shared.css?v=15">
</head>
<body>

<div class="header">
  <h1>Delete Test Accounts</h1>
  <div class="subtitle">Auto-removes any account with "test" in the username</div>
</div>

<div class="main">
  <div class="auth-card">
    <div id="result" style="text-align:center;padding:12px;font-weight:600"></div>
    <div style="text-align:center;margin-top:16px">
      <a href="index.html" style="color:var(--text-muted);font-size:13px">Back to app</a>
    </div>
  </div>
</div>

<script src="firebase-config.js?v=15"></script>
<script>
  (function() {
    const users = getLocalUsers();
    const dbData = getLocalDB();
    const deleted = [];

    Object.keys(users).forEach(username => {
      if (username.includes('test')) {
        const uid = users[username].uid;

        // Remove from users registry
        delete users[username];

        // Remove from database
        if (dbData.usernames) delete dbData.usernames[username];
        if (dbData.users) delete dbData.users[uid];
        if (dbData.rounds) delete dbData.rounds[uid];

        // Remove avatar
        localStorage.removeItem('wg-avatar-' + uid);

        deleted.push(username);
      }
    });

    saveLocalUsers(users);
    saveLocalDB(dbData);

    // Clear session if current user was a test account
    const session = getSession();
    if (session && session.username && session.username.toLowerCase().includes('test')) {
      clearSession();
    }

    // Clear round storage
    localStorage.removeItem('westchester-golf-v2');
    localStorage.removeItem('active-round-v2');
    localStorage.removeItem('active-group-code');

    const resultEl = document.getElementById('result');
    if (deleted.length) {
      resultEl.style.color = 'var(--accent)';
      resultEl.textContent = 'Deleted ' + deleted.length + ' account' + (deleted.length > 1 ? 's' : '') + ': ' + deleted.join(', ');
    } else {
      resultEl.style.color = 'var(--text-muted)';
      resultEl.textContent = 'No test accounts found.';
    }
  })();
</script>
</body>
</html>

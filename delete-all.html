<!DOCTYPE html>
<html lang="en">
<head>
<style>html,body{background:#132017}</style>
<script>
/* Storage namespacing — must run before any other script on the page.
   Live and staging are BOTH served from wontsonsoup17.github.io, and browsers
   scope localStorage to the ORIGIN, not the path. Without this, the dev site
   shares the real site's session, cached rounds, avatars and version flags:
   signing out of one signs out the other, and a localStorage.clear() on the dev
   site wipes real data.

   The prefix is decided by path/host, NOT by the firebase IS_PLAYGROUND rule,
   because the HTML files are identical on both deployments (only
   firebase-config.js differs). On LIVE the prefix is '' and this whole shim
   no-ops, so live behaviour is byte-for-byte unchanged and no user is signed
   out. */
(function () {
  var h = location.hostname, p = location.pathname || '';
  var pre = (h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0') ? 'dev-'
          : (p.indexOf('/Golf-App-Staging') === 0) ? 'stg-'
          : '';
  if (!pre) return;                         // live — leave everything alone
  var real;
  try { real = window.localStorage; if (!real) return; } catch (e) { return; }
  function mine() {
    var out = [];
    for (var i = 0; i < real.length; i++) {
      var k = real.key(i);
      if (k && k.indexOf(pre) === 0) out.push(k);
    }
    return out;
  }
  var shim = {
    getItem:    function (k) { return real.getItem(pre + k); },
    setItem:    function (k, v) { return real.setItem(pre + k, v); },
    removeItem: function (k) { return real.removeItem(pre + k); },
    // Only ever clears this build's own keys — never the live site's.
    clear:      function () { mine().forEach(function (k) { real.removeItem(k); }); },
    key:        function (i) { var a = mine(); return i < a.length ? a[i].slice(pre.length) : null; },
    get length() { return mine().length; }
  };
  try {
    Object.defineProperty(window, 'localStorage',
      { value: shim, configurable: true, writable: true });
  } catch (e) { /* if it fails we simply keep shared storage — today's behaviour */ }
})();
</script>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#132017">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Delete All Accounts - Golf Tracker</title>
<link rel="stylesheet" href="shared.css?v=15">
</head>
<body>

<div class="header">
  <h1>Delete All Accounts</h1>
  <div class="subtitle">Wipes every account and all data</div>
</div>

<div class="main">
  <div class="auth-card">
    <div id="result" style="text-align:center;padding:12px;font-weight:600"></div>
    <div style="text-align:center;margin-top:16px">
      <a href="login.html" style="color:var(--text-muted);font-size:13px">Back to login</a>
    </div>
  </div>
</div>

<script src="firebase-config.js?v=15"></script>
<script>
  (function() {
    var count = 0;
    try { count = Object.keys(getLocalUsers()).length; } catch(e) {}

    // Nuclear clear — wipe ALL localStorage for this domain
    localStorage.clear();

    // Also wipe Firebase: credentials, usernames, and user data
    var resultEl = document.getElementById('result');
    resultEl.style.color = 'var(--text-muted)';
    resultEl.textContent = 'Clearing all data...';

    _firebaseLoadPromise.then(function() {
      if (!_firebaseReady || !_firebaseDB) {
        resultEl.style.color = 'var(--bogey)';
        resultEl.textContent = 'Local data wiped. Firebase offline — could not clear cloud data.';
        return;
      }
      Promise.all([
        _firebaseDB.ref('credentials').remove(),
        _firebaseDB.ref('usernames').remove(),
        _firebaseDB.ref('users').remove()
      ]).then(function() {
        resultEl.style.color = 'var(--green-accent)';
        resultEl.textContent = 'All data wiped — local + Firebase cleared. Redirecting...';
        // Redirect to login with cache-busting timestamp to force fresh page load
        setTimeout(function() {
          window.location.href = 'login.html?_=' + Date.now();
        }, 1500);
      }).catch(function(err) {
        resultEl.style.color = 'var(--bogey)';
        resultEl.textContent = 'Local wiped. Firebase error: ' + (err.message || 'Unknown error');
      });
    });
  })();
</script>
</body>
</html>
